plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.staybook'
version = '0.0.1'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-mail'   // 이메일 인증코드, 비밀번호 재설정 메일

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.6'

    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'   // 패키지 의존 방향 검사
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    //swagger
    // build.gradle dependencies에 추가
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
}

tasks.named('test') {
    useJUnitPlatform()

    // 테스트 전용 값. 실제 키가 아니며, 환경 변수가 이미 있으면 그 값을 쓴다.
    def testDefaults = [
            JWT_SECRET           : 'test-only-jwt-secret-test-only-jwt-secret-0123456789',
            CRYPTO_ENCRYPTION_KEY: 'dGVzdC1vbmx5LWVuY3J5cHRpb24ta2V5LTMyYnl0ZSE=',
            CRYPTO_HASH_KEY      : 'test-only-hash-key-test-only-hash-key'
    ]
    // 루트의 .env(docker-compose와 같은 파일)를 테스트 JVM에 넘긴다.
    // PC에 같은 이름의 환경 변수가 남아 있어도 테스트는 .env의 DB·Redis로 접속한다.
    def envFile = rootProject.file('.env')
    if (envFile.exists()) {
        envFile.eachLine('UTF-8') { line ->
            def m = line =~ /^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$/
            if (m.matches()) {
                environment m.group(1), m.group(2).trim()
            }
        }
    }

    testDefaults.each { name, value ->
        if (System.getenv(name) == null) {
            environment name, value
        }
    }
}
